name: Validate readable homework archive fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic patch
        shell: bash
        run: |
          if ! grep -q "async function showStudentArchive" api/bot.js; then
            git show origin/main:scripts/apply-readable-archive-fix.py > /tmp/apply-fix.py
            set +e
            python /tmp/apply-fix.py
            patch_status=$?
            set -e
            if ! grep -q "async function showStudentArchive" api/bot.js; then
              exit "$patch_status"
            fi
          fi
          git show origin/main:scripts/apply-readable-archive-smoke-fix.py > /tmp/apply-smoke-fix.py
          python /tmp/apply-smoke-fix.py
      - name: Run tests
        run: npm test
      - name: Commit validated patch to PR branch
        shell: bash
        run: |
          rm -f .archive-fix-trigger
          git config user.name 'openai-agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add -A api/bot.js tests/smoke.mjs .archive-fix-trigger
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m 'make archived homework readable'
          git push origin HEAD:${{ github.head_ref }}
