name: Patch active homework backfill once

on:
  push:
    branches: [codex/simplify-bot]
    paths:
      - '.github/workflows/patch-backfill-active-homework-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/simplify-bot

      - name: Patch bot
        run: |
          python .github/patch-backfill-active-homework.py
          node --check api/bot.js

      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/bot.js
          git commit -m 'Assign active homework to newly added students'
          git rm .github/patch-backfill-active-homework.py .github/workflows/patch-backfill-active-homework-once.yml
          git commit -m 'Remove one-shot active homework backfill files'
          git push origin HEAD:codex/simplify-bot
