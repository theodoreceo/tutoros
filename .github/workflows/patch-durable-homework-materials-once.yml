name: Patch durable homework materials once

on:
  push:
    branches:
      - codex/simplify-bot
    paths:
      - .github/workflows/patch-durable-homework-materials-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/simplify-bot
      - name: Apply patch
        run: |
          python scripts/patch_durable_homework_materials.py
          node --check api/bot.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/bot.js
          git commit -m 'Store homework PDFs durably in Supabase Storage'
          git rm .github/workflows/patch-durable-homework-materials-once.yml scripts/patch_durable_homework_materials.py
          git commit -m 'Remove one-shot durable materials patch files'
          git push origin HEAD:codex/simplify-bot
