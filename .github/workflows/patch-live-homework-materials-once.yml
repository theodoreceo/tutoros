name: Patch live homework materials once
on:
  push:
    branches: [codex/simplify-bot]
    paths:
      - '.github/workflows/patch-live-homework-materials-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live bot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/bot.js')
          src = path.read_text(encoding='utf-8')

          if 'async function showDzMaterials(chatId, hwId) {' not in src:
              start = src.index('async function showDzDetail(chatId, hwId) {')
              end = src.index('async function remindMissingStudents(chatId, hwId) {', start)
              block = src[start:end]

              archived_marker = "  const buttons = a.archived_at\n    ? [\n"
              if archived_marker not in block:
                  raise SystemExit('archived buttons marker not found')
              block = block.replace(
                  archived_marker,
                  archived_marker + "        [{ text: '📎 материалы', callback_data: `dz_materials:${hwId}` }],\n",
                  1,
              )

              active_marker = "    : [\n"
              if active_marker not in block:
                  raise SystemExit('active buttons marker not found')
              block = block.replace(
                  active_marker,
                  active_marker + "        [{ text: '📎 материалы', callback_data: `dz_materials:${hwId}` }],\n",
                  1,
              )
              src = src[:start] + block + src[end:]

              fn_marker = 'async function remindMissingStudents(chatId, hwId) {'
              materials_fn = r'''async function showDzMaterials(chatId, hwId) {
                const assignment = await sbOne('homework_assignments',
                  `id=eq.${encodeURIComponent(hwId)}&select=id,topic,file_id,archived_at`);
                if (!assignment) return send(chatId, 'ДЗ не найдено.');

                const back = kbd([[{ text: '← назад к ДЗ', callback_data: `dz:${hwId}` }]]);
                if (!assignment.file_id) {
                  return send(chatId, `к ДЗ «${html(assignment.topic || '—')}» материалы не прикреплены.`, back);
                }

                try {
                  await sendAttachment(chatId, assignment.file_id);
                } catch (error) {
                  console.warn('VK homework material send failed:', error?.message || error);
                  return send(chatId,
                    `⚠️ материал к ДЗ «${html(assignment.topic || '—')}» сохранён в базе, но VK больше не даёт открыть это вложение.`,
                    back);
                }

                return send(chatId,
                  `📎 материал к ДЗ «${html(assignment.topic || '—')}»`,
                  back);
              }

              '''
              src = src.replace(fn_marker, materials_fn + fn_marker, 1)

              callback_marker = "  if (data.startsWith('dz:') && owner) {\n    return showDzDetail(chatId, data.slice(3));\n  }\n"
              if callback_marker not in src:
                  raise SystemExit('dz callback marker not found')
              src = src.replace(
                  callback_marker,
                  "  if (data.startsWith('dz_materials:') && owner) {\n    return showDzMaterials(chatId, data.slice('dz_materials:'.length));\n  }\n" + callback_marker,
                  1,
              )
          path.write_text(src, encoding='utf-8')
          PY
          node --check api/bot.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-live-homework-materials-once.yml
          git add api/bot.js
          git commit -m 'Add materials viewer to live VK bot'
          git push origin HEAD:codex/simplify-bot
