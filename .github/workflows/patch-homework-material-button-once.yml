name: Patch homework material button once
on:
  push:
    paths:
      - '.github/workflows/patch-homework-material-button-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make materials button always visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/bot.js')
          s = p.read_text()
          old = "...(a.file_id ? [[{ text: '📎 открыть материалы', callback_data: `dz_materials:${hwId}` }]] : []),"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 conditional material buttons, found {count}')
          s = s.replace(old, "[{ text: '📎 материалы', callback_data: `dz_materials:${hwId}` }],")
          p.write_text(s)
          PY
          node --check api/bot.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/bot.js
          git commit -m 'Always show homework materials button'
          git rm .github/workflows/patch-homework-material-button-once.yml
          git commit -m 'Remove one-shot materials button workflow'
          git push
