name: Patch homework material button once
on:
  push:
    paths:
      - '.github/workflows/patch-homework-material-button-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Make materials button always visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/bot.js')
          s = p.read_text()
          old = "...(a.file_id ? [[{ text: '📎 открыть материалы', callback_data: `dz_materials:${hwId}` }]] : []),"
          count = s.count(old)
          if count == 2:
              s = s.replace(old, "[{ text: '📎 материалы', callback_data: `dz_materials:${hwId}` }],")
              p.write_text(s)
          elif "[{ text: '📎 материалы', callback_data: `dz_materials:${hwId}` }]," not in s:
              raise SystemExit(f'unexpected material button state; old count={count}')
          PY
          node --check api/bot.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/bot.js
          if ! git diff --cached --quiet; then git commit -m 'Always show homework materials button'; fi
          git rm .github/workflows/patch-homework-material-button-once.yml
          git commit -m 'Remove one-shot materials button workflow'
          git pull --rebase origin main
          git push origin main
